name: Build

# Confere que o app continua compilando para web e Android e deixa os
# arquivos gerados (site e APK) para download na página da execução.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.35.7'

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Compilar para web (release)
        run: flutter build web --release

      - name: Publicar o site compilado
        uses: actions/upload-artifact@v4
        with:
          name: fabrica-software-web
          path: build/web
          retention-days: 14

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17 (exigido pelo Gradle do Android)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Compilar APK (release, assinado com a chave de debug)
        run: flutter build apk --release

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: fabrica-software-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
