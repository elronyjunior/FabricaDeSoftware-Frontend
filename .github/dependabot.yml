# Dependabot: abre pull requests semanais atualizando os pacotes Dart/Flutter
# (pubspec) e as versões das GitHub Actions usadas nos workflows.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
